name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una sola publicación a la vez; si llega otro push, se cancela la anterior.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  comprobar-y-construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Si algo falla aquí, no se publica.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - run: npm run build
        env:
          # Configuración pública (la seguridad la da RLS). Se definen en Settings → Variables del repositorio.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}

      # SPA en GitHub Pages: las rutas profundas caen en 404.html, que es la propia app (pero con estado 404).
      # Las rutas fijas se copian como carpetas para que respondan 200 (enlaces directos, recargas y Lighthouse).
      - run: |
          cp dist/index.html dist/404.html
          for ruta in portal admin admin/entrar admin/faq; do
            mkdir -p "dist/$ruta" && cp dist/index.html "dist/$ruta/index.html"
          done

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  publicar:
    needs: comprobar-y-construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v5
